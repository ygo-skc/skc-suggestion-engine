services:
  skc-suggestion-engine:
    image: alpine:latest
    command: ./skc-suggestion-engine
    working_dir: /app
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "9000:9000"
    volumes:
      - "./skc-suggestion-engine:/app/skc-suggestion-engine:ro"
      - "./data/:/app/data/:ro"
      - "./certs/:/app/certs/:ro"
      - "./.env_prod:/app/.env_prod:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"] # checks tcp only
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    memswap_limit: 75m # go's GC doesn't utilze swap well
    deploy:
      resources:
        limits:
          memory: 75m
          cpus: "1.0" # Go 1.25+ derives GOMAXPROCS from this
          pids: 128
    networks:
      - skc
    environment:
      - SKC_SUGGESTION_ENGINE_DOT_ENV_FILE=.env_prod
      - GOMEMLIMIT=60MiB
    labels:
      com.datadoghq.ad.init_configs: "[{}]"
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port": "%%port%%"}]'
      com.datadoghq.ad.logs: >-
        [{
          "source": "go",
          "service": "skc-suggestion-engine",
          "log_processing_rules": [{
            "type": "exclude_at_match",
            "name": "exclude_health_check",
            "pattern" : "\"app.flow\":\"Status\""
          }]
        }]
      com.datadoghq.tags.env: "prod"
      com.datadoghq.tags.service: "skc-suggestion-engine"

networks:
  skc:
    name: skc
    driver: bridge
    external: true # network was alredy created, if you need to recreate the network - make this false
