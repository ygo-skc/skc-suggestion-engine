services:
  skc-suggestion-engine:
    image: alpine:latest
    command: ./skc-suggestion-engine
    working_dir: /app
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL] # port 9000 > 1024, no capabilities needed
    security_opt:
      - no-new-privileges:true
    ports:
      - "9001:9000"
    volumes:
      - "./skc-suggestion-engine:/app/skc-suggestion-engine:ro"
      - "./data/:/app/data/:ro"
      - "./certs/certificate.crt:/app/certs/certificate.crt:ro"
      - "./certs/ca_bundle.crt:/app/certs/ca_bundle.crt:ro"
      - "./certs/private.key:/app/certs/private.key:ro"
      - "./certs/skc-suggestion-engine-db.pem:/app/certs/skc-suggestion-engine-db.pem:ro"
      - "./.env_docker_local:/app/.env_docker_local:ro"
    tmpfs:
      - /app/certs:size=64k,mode=0700,uid=1000,gid=1000 # app writes concatenated.crt here at startup
    restart: unless-stopped
    healthcheck:
      # TCP check only - /status fans out to ygo-service + Mongo on every call
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    memswap_limit: 75m # equal to memory limit - disables swap
    deploy:
      resources:
        limits:
          memory: 75m
          cpus: "1.0" # Go 1.25+ derives GOMAXPROCS from this
          pids: 128
    networks:
      - skc
    environment:
      - SKC_SUGGESTION_ENGINE_DOT_ENV_FILE=.env_docker_local
      - GOMEMLIMIT=60MiB

networks:
  skc:
    name: skc
    driver: bridge
    external: true # network was alredy created, if you need to recreate the network - make this false
